<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arts 2026 - Live Scores</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Uroob&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Chilanka&display=swap" rel="stylesheet">

<link rel="stylesheet" href="index.css">
</head>

<body>

<div class="arts-frame">
  <div class="arts-content">
    <h1 class="arts-title">ഇലുക്ക്</h1>
    <div class="arts-subtitle">Arts Fest 2025–26</div>
    <div class="arts-subtitle">SWADHA STUDENTS' UNION</div>
  </div>
</div>

<h1>🏆 Live Score Board</h1>

<div class="score-card">
  <div class="card red" id="redTotal">Red: 0</div>
  <div class="card green" id="greenTotal">Green: 0</div>
  <div class="card blue" id="blueTotal">Blue: 0</div>
  <div class="card yellow" id="yellowTotal">Yellow: 0</div>
</div>

<table id="resultsTable">
  <thead>
    <tr>
      <th>Off Stage / On Stage</th>
      <th>Red</th>
      <th>Green</th>
      <th>Blue</th>
      <th>Yellow</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>


<!-- ===== ON STAGE RESULTS ===== -->
<div class="results-section">
  <h2 class="results-heading">🎭 On Stage Results</h2>

  <div class="select-wrapper">
    <select id="onStageSelect">
      <option value="">Select On Stage Item</option>
    </select>
  </div>

  <div id="onStageResultBox"></div>
</div>

<!-- ===== OFF STAGE RESULTS ===== -->
<div class="results-section">
  <h2 class="results-heading">🖌 Off Stage Results</h2>

  <div class="select-wrapper">
    <select id="offStageSelect">
      <option value="">Select Off Stage Item</option>
    </select>
  </div>

  <div id="offStageResultBox"></div>
</div>



<footer>
  <p>&copy; Arts Fest 2026</p>
  <p>Government Women's Polytechnic College Kottakkal</p>
</footer>

<script src="index.js"></script>
</body>
</html>
